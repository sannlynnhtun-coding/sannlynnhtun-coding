<svg xmlns="http://www.w3.org/2000/svg" width="420" height="365" viewBox="0 0 420 365" role="img" aria-labelledby="title"><title id="title">Sann Lynn Htun: Senior Software Engineer, Team Lead, Open-source Developer. Helping beginners and juniors build skills for senior roles.</title><style>:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#087f70;--purple:#7047b8}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9da7b3;--accent:#5ee0c4;--purple:#bc9cff}}</style><rect x="1" y="1" width="418" height="363" rx="16" fill="var(--bg)" stroke="var(--border)"/><rect x="1" y="1" width="418" height="42" rx="16" fill="var(--panel)"/><text x="24" y="28" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="var(--muted)">Profile.cs</text><text x="314" y="28" font-family="Consolas, monospace" font-size="13" font-weight="400" fill="var(--accent)">C# / .NET</text><text x="24" y="85" font-family="Consolas, monospace" font-size="15" font-weight="400" fill="var(--muted)">// We live. We code. We yoke.</text><text x="24" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="var(--fg)">Sann Lynn Htun</text><text x="24" y="173" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="var(--fg)">Senior Software Engineer</text><text x="24" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="var(--accent)">Team Lead · Open-source Developer</text><text x="24" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="var(--fg)">Helping beginners and juniors</text><text x="24" y="277" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="var(--fg)">build skills for senior roles.</text><text x="24" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="var(--muted)">Yangon, Myanmar · Since 2015</t