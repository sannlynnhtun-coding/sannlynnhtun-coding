<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="title"><title id="title">Blazor Gist Hub. Browse, save, and organize your GitHub Gists. Blazor WebAssembly · IndexedDB. Illustration, not an app screenshot.</title><style>:root{--bg:#ffffff;--panel:#f6f8fa;--border:#d0d7de;--fg:#1f2328;--muted:#59636e;--accent:#087f70;--purple:#7047b8}@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#9da7b3;--accent:#5ee0c4;--purple:#bc9cff}}</style><rect x="1" y="1" width="418" height="418" rx="16" fill="var(--bg)" stroke="var(--border)"/><text x="25" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="var(--fg)">Blazor Gist Hub</text><text x="25" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="var(--muted)">Browse, save, and organize</text><text x="25" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" fill="var(--muted)">your GitHub Gists.</text><text x="25" y="153" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="var(--accent)">Blazor WebAssembly · IndexedDB</text><g transform="translate(70 188)"><rect x="0" y="0" width="245" height="156" rx="9" fill="var(--panel)" stroke="var(--border)"/><rect x="18" y="16" width="245" height="156" rx="9" fill="var(--panel)" stroke="var(--border)"/><rect x="36" y="32" width="245" height="156" rx="9" fill="var(--panel)" stroke="var(--border)"/><text x="54" y="66" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="var(--muted)">snippet.cs</text><text x="54" y="103" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="var(--purple)">public class Gist</text><text x="54" y="132" font-family="Consolas, monospace" font-size="16" font-weight="400" fill="var(--accent)">{ /* saved */ }</text><rect x="197" y="148" width="66" height="30" rx="8" fill="var(--a